[package]
name = "folderbase-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
homepage.workspace = true
repository.workspace = true
readme.workspace = true
description = "Folderbase command-line tools for agent-ready local-first folders."
documentation = "https://docs.rs/folderbase-cli"
keywords = ["agents", "filesystem", "local-first", "knowledge"]
categories = ["command-line-utilities", "filesystem"]
exclude = [
  "tests/folderbase_full_eclipse.rs",
  "tests/public_conformance.rs",
  "tests/root_reconstruction_public_conformance.rs",
  "tests/transform_fixture.rs",
]

[[bin]]
name = "folderbase"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
folderbase-core = { version = "0.6.1", path = "../folderbase-core" }
notify.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
