[workspace]
members = [
    "crates/folderbase-core",
    "crates/folderbase-cli",
]
resolver = "3"

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.96"
homepage = "https://folderbase.ai"
repository = "https://github.com/chalkagents/folderbase"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
jsonschema = "=0.48.5"
predicates = "3.1"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision", "preserve_order", "raw_value"] }
sha2 = "0.10"
same-file = "1.0"
tempfile = "3.20"
thiserror = "2.0"
unicode-casefold = "0.2"
unicode-normalization = "0.1"
uuid = { version = "1.18", features = ["serde", "v7"] }
walkdir = "2.5"
winapi-util = "0.1.11"
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
