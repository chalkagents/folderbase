name: Release native CLI and npm launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Core tag to build and backfill
        required: true
        type: string
      publish_npm:
        description: Publish npm after the native artifacts are ready
        required: true
        default: false
        type: boolean

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out distribution sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the exact native Core tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: native-source

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Require tag and package versions to agree
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          package_version="$(
            cargo metadata --manifest-path native-source/Cargo.toml --format-version 1 --no-deps |
              jq -r '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace package versions differ") end'
          )"
          npm_version="$(node -p "require('./packages/npm-cli/package.json').version")"
          test "$release_version" = "$package_version"
          test "$release_version" = "$npm_version"

      - name: Build the native CLI
        run: |
          cargo build \
            --manifest-path native-source/Cargo.toml \
            --locked \
            --release \
            --package folderbase-cli \
            --target "${{ matrix.target }}"

      - name: Verify and stage the native CLI
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          binary="native-source/target/${{ matrix.target }}/release/folderbase"
          test "$("$binary" --version)" = "folderbase $release_version"
          mkdir -p dist
          install -m 0755 \
            "$binary" \
            "dist/folderbase-${RELEASE_TAG}-${{ matrix.target }}"

      - name: Upload the native CLI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.target }}
          path: dist/folderbase-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release and npm launcher
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out distribution sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Download native CLIs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Seal the release artifacts
        shell: bash
        run: |
          expected=(
            "folderbase-${RELEASE_TAG}-aarch64-apple-darwin"
            "folderbase-${RELEASE_TAG}-x86_64-apple-darwin"
            "folderbase-${RELEASE_TAG}-aarch64-unknown-linux-gnu"
            "folderbase-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          )
          test "$(find dist -maxdepth 1 -type f -name 'folderbase-*' | wc -l | tr -d ' ')" = "${#expected[@]}"
          for asset in "${expected[@]}"; do
            test -f "dist/$asset"
          done
          (
            cd dist
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Test the npm distribution package
        run: |
          npm test --prefix packages/npm-cli
          node scripts/test-npm-cli-package.mjs

      - name: Publish GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            remote_assets="$(mktemp -d)"
            trap 'rm -rf "$remote_assets"' EXIT
            for asset in dist/*; do
              asset_name="$(basename "$asset")"
              if gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name' |
                grep -Fqx "$asset_name"
              then
                gh release download "$RELEASE_TAG" \
                  --dir "$remote_assets" \
                  --pattern "$asset_name"
                cmp "$asset" "$remote_assets/$asset_name"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            gh release create "$RELEASE_TAG" \
              dist/* \
              --generate-notes \
              --title "Folderbase Core $RELEASE_TAG" \
              --verify-tag
          fi

      - name: Use an OIDC-capable npm client
        if: github.event_name == 'push' || inputs.publish_npm
        run: npm install --global npm@11.5.1

      - name: Publish the public npm launcher
        if: github.event_name == 'push' || inputs.publish_npm
        working-directory: packages/npm-cli
        run: npm publish --access public
