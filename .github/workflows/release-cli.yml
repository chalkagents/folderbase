name: Release native CLI and npm launcher

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Core tag to build and backfill
        required: true
        type: string
      publish_npm:
        description: Publish npm after the native artifacts are ready
        required: true
        default: false
        type: boolean

permissions: {}

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu

    steps:
      - name: Check out distribution sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the exact native Core tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          fetch-depth: 0
          path: native-source

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Verify the canonical remote tag and package versions
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          package_version="$(
            cargo metadata --manifest-path native-source/Cargo.toml --format-version 1 --no-deps |
              jq -r '[.packages[].version] | unique | if length == 1 then .[0] else error("workspace package versions differ") end'
          )"
          npm_version="$(jq -r '.version' packages/npm-cli/package.json)"
          canonical_tag="v${package_version}"
          test "$RELEASE_TAG" = "$canonical_tag"
          test "$release_version" = "$package_version"
          test "$release_version" = "$npm_version"
          remote_tag_object="$(
            git -C native-source ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" |
              awk 'NR == 1 { print $1 }'
          )"
          remote_tag_commit="$(
            git -C native-source ls-remote --tags origin "refs/tags/${RELEASE_TAG}^{}" |
              awk 'NR == 1 { print $1 }'
          )"
          remote_tag_commit="${remote_tag_commit:-$remote_tag_object}"
          checked_out_commit="$(git -C native-source rev-parse HEAD)"
          test "$checked_out_commit" = "$remote_tag_commit"

      - name: Build the native CLI
        run: |
          cargo build \
            --manifest-path native-source/Cargo.toml \
            --locked \
            --release \
            --package folderbase-cli \
            --target "${{ matrix.target }}"

      - name: Verify and stage the native CLI
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          binary="native-source/target/${{ matrix.target }}/release/folderbase"
          test "$("$binary" --version)" = "folderbase $release_version"
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          printf 'release smoke\n' > "$smoke_root/ordinary-file.txt"
          "$binary" inspect "$smoke_root" --json
          "$binary" init "$smoke_root" --name "Release Smoke" --json
          "$binary" validate "$smoke_root" --json
          test -f "$smoke_root/.folderbase/manifest.json"
          mkdir -p dist
          install -m 0755 \
            "$binary" \
            "dist/folderbase-${RELEASE_TAG}-${{ matrix.target }}"

      - name: Upload the native CLI
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.target }}
          path: dist/folderbase-${{ env.RELEASE_TAG }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release and npm launcher
    needs: build-native
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out distribution sources
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Verify the canonical package tag
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/npm-cli/package.json').version")"
          canonical_tag="v${package_version}"
          test "$RELEASE_TAG" = "$canonical_tag"

      - name: Select stable or prerelease publication channels
        id: release-metadata
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/npm-cli/package.json').version")"
          if [[ "$package_version" == *-* ]]; then
            github_prerelease=true
            npm_dist_tag=next
          else
            github_prerelease=false
            npm_dist_tag=latest
          fi
          echo "github_prerelease=$github_prerelease" >> "$GITHUB_OUTPUT"
          echo "npm_dist_tag=$npm_dist_tag" >> "$GITHUB_OUTPUT"

      - name: Download native CLIs
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: native-*
          path: dist
          merge-multiple: true

      - name: Seal the release artifacts
        shell: bash
        run: |
          expected=(
            "folderbase-${RELEASE_TAG}-aarch64-apple-darwin"
            "folderbase-${RELEASE_TAG}-x86_64-apple-darwin"
            "folderbase-${RELEASE_TAG}-aarch64-unknown-linux-gnu"
            "folderbase-${RELEASE_TAG}-x86_64-unknown-linux-gnu"
          )
          test "$(find dist -maxdepth 1 -type f -name 'folderbase-*' | wc -l | tr -d ' ')" = "${#expected[@]}"
          for asset in "${expected[@]}"; do
            test -f "dist/$asset"
          done
          (
            cd dist
            sha256sum "${expected[@]}" > SHA256SUMS
          )

      - name: Test the npm distribution package
        run: |
          npm test --prefix packages/npm-cli
          node scripts/test-npm-cli-package.mjs

      - name: Publish GitHub release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_PRERELEASE: ${{ steps.release-metadata.outputs.github_prerelease }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            existing_prerelease="$(
              gh release view "$RELEASE_TAG" --json isPrerelease --jq '.isPrerelease'
            )"
            test "$existing_prerelease" = "$GITHUB_PRERELEASE"
            remote_assets="$(mktemp -d)"
            trap 'rm -rf "$remote_assets"' EXIT
            for asset in dist/*; do
              asset_name="$(basename "$asset")"
              if gh release view "$RELEASE_TAG" \
                --json assets \
                --jq '.assets[].name' |
                grep -Fqx "$asset_name"
              then
                gh release download "$RELEASE_TAG" \
                  --dir "$remote_assets" \
                  --pattern "$asset_name"
                cmp "$asset" "$remote_assets/$asset_name"
              else
                gh release upload "$RELEASE_TAG" "$asset"
              fi
            done
          else
            github_release_flags=()
            if [[ "$GITHUB_PRERELEASE" == true ]]; then
              github_release_flags+=(--prerelease --latest=false)
            fi
            gh release create "$RELEASE_TAG" \
              dist/* \
              --generate-notes \
              --title "Folderbase Core $RELEASE_TAG" \
              --verify-tag \
              "${github_release_flags[@]}"
          fi

      - name: Use an OIDC-capable npm client
        if: github.event_name == 'push' || inputs.publish_npm
        run: npm install --global npm@11.5.1

      - name: Check immutable npm publication state
        id: npm-publication
        if: github.event_name == 'push' || inputs.publish_npm
        env:
          NPM_DIST_TAG: ${{ steps.release-metadata.outputs.npm_dist_tag }}
        shell: bash
        working-directory: packages/npm-cli
        run: |
          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          package_spec="${package_name}@${package_version}"
          local_integrity="$(
            npm pack --dry-run --json |
              node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[0].integrity));'
          )"
          view_error="$(mktemp)"
          trap 'rm -f "$view_error"' EXIT
          if published_metadata="$(
            npm view "$package_spec" version dist.integrity --json 2>"$view_error"
          )"; then
            published_version="$(
              printf '%s' "$published_metadata" |
                node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).version || ""));'
            )"
            published_integrity="$(
              printf '%s' "$published_metadata" |
                node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)["dist.integrity"] || ""));'
            )"
            if [[ "$published_version" != "$package_version" \
              || -z "$published_integrity" \
              || "$published_integrity" != "$local_integrity" ]]
            then
              echo "Published $package_spec does not match the exact release npm package." >&2
              exit 1
            fi

            dist_tags="$(npm view "$package_name" dist-tags --json)"
            selected_dist_tag_version="$(
              printf '%s' "$dist_tags" |
                NPM_DIST_TAG="$NPM_DIST_TAG" node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input)[process.env.NPM_DIST_TAG] || ""));'
            )"
            latest_version="$(
              printf '%s' "$dist_tags" |
                node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk); process.stdin.on("end", () => process.stdout.write(JSON.parse(input).latest || ""));'
            )"
            if [[ "$selected_dist_tag_version" != "$package_version" \
              || ( "$NPM_DIST_TAG" != latest && "$latest_version" == "$package_version" ) ]]
            then
              echo "Published $package_spec does not have the required $NPM_DIST_TAG channel state." >&2
              exit 1
            fi
            echo "skip_publish=true" >> "$GITHUB_OUTPUT"
          else
            if grep -Eq 'E404|404 Not Found' "$view_error"; then
              echo "skip_publish=false" >> "$GITHUB_OUTPUT"
            else
              cat "$view_error" >&2
              exit 1
            fi
          fi

      - name: Publish the public npm launcher
        if: (github.event_name == 'push' || inputs.publish_npm) && steps.npm-publication.outputs.skip_publish != 'true'
        env:
          NPM_DIST_TAG: ${{ steps.release-metadata.outputs.npm_dist_tag }}
        working-directory: packages/npm-cli
        run: npm publish --access public --tag "$NPM_DIST_TAG"
