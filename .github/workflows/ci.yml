name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Enforce the CI trigger and action-pin policy
        run: scripts/check-ci-policy.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Enforce the Folderbase-only public surface
        run: scripts/check-public-eclipse.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify the independent reorganization digest vector
        run: node scripts/verify-reorganization-digest-vector.mjs

      - name: Verify independent Folderbase Version 0.4 digest vectors
        run: node scripts/verify-folderbase-version-digest-vectors.mjs

      - name: Verify the Folderbase Version 0.4 repository distribution
        run: node scripts/verify-folderbase-version-distribution.mjs

      - name: Verify independent Folderbase Version 0.5 digest vectors
        run: node scripts/verify-folderbase-version-0.5-digest-vectors.mjs

      - name: Verify the complete Folderbase Version 0.5 candidate closure
        run: node scripts/verify-folderbase-version-0.5-distribution.mjs

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Verify packages and installed CLI
        run: scripts/test-package-install.sh

  core-platforms:
    name: Core platform gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test the public Folderbase Version contract
        run: cargo test --package folderbase-core --test folderbase_version_conformance --locked

      - name: Test the Folderbase Version 0.5 candidate contract
        run: cargo test --package folderbase-core --test folderbase_version_05_conformance --locked

      - name: Test metadata-only Folderbase capture planning
        run: cargo test --package folderbase-core --test folderbase_capture --locked

      - name: Test Folderbase sealing and Local Head recovery
        run: cargo test --package folderbase-core --test folderbase_seal --locked

      - name: Test injected seal crash recovery
        run: "cargo test --package folderbase-core --lib --locked folderbase_seal::tests::"

      - name: Test state confinement
        run: "cargo test --package folderbase-core --lib --locked folderbase_state::tests::"

      - name: Test independent-handle locking
        run: cargo test --package folderbase-core --lib --locked local_versions::tests::transaction_lock_is_exclusive_across_independent_handles

      - name: Test the public migration transaction contract
        run: cargo test --package folderbase-core --test migration_transaction_contract --locked

      - name: Test migration compatibility and lifecycle behavior
        run: cargo test --package folderbase-core --test migration --locked

      - name: Test transaction-v1 crash, restart, conflict, and rollback matrices
        run: "cargo test --package folderbase-core --lib --locked migration::migration_transaction_red_tests::"

      - name: Verify independent Folderbase Version 0.4 digest vectors
        run: node scripts/verify-folderbase-version-digest-vectors.mjs

      - name: Verify independent Folderbase Version 0.5 digest vectors
        run: node scripts/verify-folderbase-version-0.5-digest-vectors.mjs

      - name: Test the public receiver contract
        run: cargo test --package folderbase-core --test transfer_receiver --locked

      - name: Test the public root-attestation contract
        run: cargo test --package folderbase-core --test root_attestation --locked

      - name: Test the root-attestation CLI contract
        run: cargo test --package folderbase-cli --test attest --locked
