name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan CI scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.scope.outputs.docs }}
      install: ${{ steps.scope.outputs.install }}
      npm: ${{ steps.scope.outputs.npm }}
      platform: ${{ steps.scope.outputs.platform }}
      rust: ${{ steps.scope.outputs.rust }}

    steps:
      - name: Check out repository history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Enforce CI and release policy
        run: scripts/check-ci-policy.sh

      - name: Classify changed paths
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            node scripts/ci/classify-changes.mjs --full </dev/null
          elif [[ -z "$CI_BASE_SHA" || "$CI_BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$CI_BASE_SHA^{commit}"; then
            node scripts/ci/classify-changes.mjs --full </dev/null
          else
            git diff --name-only "$CI_BASE_SHA" "$CI_HEAD_SHA" -- |
              node scripts/ci/classify-changes.mjs
          fi

  docs:
    name: Documentation site gate
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify documentation policy
        run: node --test scripts/tests/docs-site.test.mjs

      - name: Install documentation dependencies
        run: npm ci --prefix apps/docs

      - name: Lint, type-check, and build documentation
        run: npm test --prefix apps/docs

  npm-cli:
    name: npm CLI distribution gate
    needs: plan
    if: needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test the npm launcher
        run: npm test --prefix packages/npm-cli

      - name: Test the packed npm command
        run: node scripts/test-npm-cli-package.mjs

      - name: Install the TypeScript SDK development dependencies
        run: npm ci --prefix packages/sdk

      - name: Test the TypeScript SDK adapter contract
        run: npm test --prefix packages/sdk

      - name: Test release publication policy
        run: node --test protocol/conformance/cli-json-v1/schema.test.mjs protocol/conformance/capabilities/run.test.mjs scripts/tests/capability-contract.test.mjs scripts/tests/compatibility-contract.test.mjs scripts/tests/npm-publication-policy.test.mjs scripts/tests/ci-policy.test.mjs scripts/tests/ci-required-results.test.mjs scripts/tests/ci-scope.test.mjs scripts/tests/release-scripts.test.mjs

      - name: Test optional capability contracts
        run: node --test protocol/conformance/capabilities/query-index-0.1/suite.test.mjs

      - name: Test template capability contracts
        run: node --test protocol/conformance/capabilities/template-expansion-0.1/suite.test.mjs

      - name: Test Change Set capability contracts
        run: node --test protocol/conformance/capabilities/change-set-0.1/suite.test.mjs

      - name: Test daemon stdio capability contracts
        run: node --test protocol/conformance/capabilities/daemon-stdio-0.1/suite.test.mjs

      - name: Verify packaged legal notices
        run: |
          cmp LICENSE packages/npm-cli/LICENSE
          cmp NOTICE packages/npm-cli/NOTICE
          cmp LICENSE packages/sdk/LICENSE
          cmp NOTICE packages/sdk/NOTICE

  rust:
    name: Linux Core gate
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Enforce the Folderbase-only public surface
        run: scripts/check-public-eclipse.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Verify the independent reorganization digest vector
        run: node scripts/verify-reorganization-digest-vector.mjs

      - name: Verify independent Folderbase Version 0.4 digest vectors
        run: node scripts/verify-folderbase-version-digest-vectors.mjs

      - name: Verify the Folderbase Version 0.4 repository distribution
        run: node scripts/verify-folderbase-version-distribution.mjs

      - name: Verify independent Folderbase Version 0.5 digest vectors
        run: node scripts/verify-folderbase-version-0.5-digest-vectors.mjs

      - name: Verify the complete Folderbase Version 0.5 released closure
        run: node scripts/verify-folderbase-version-0.5-distribution.mjs

      - name: Test immutable release verification from a mutable checkout
        run: node --test scripts/tests/released-distribution.test.mjs

      - name: Test
        run: cargo test --workspace --all-features --locked

      - name: Run public implementation-neutral conformance
        run: node protocol/conformance/cli-json-v1/run.mjs --implementation ./target/debug/folderbase

      - name: Run advertised optional-capability conformance
        run: node protocol/conformance/capabilities/run.mjs --implementation ./target/debug/folderbase

  package-install:
    name: Fresh package installation gate
    needs: plan
    if: needs.plan.outputs.install == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Verify packages and installed CLI
        run: scripts/test-package-install.sh

  core-platforms:
    name: Core platform gate (${{ matrix.os }})
    needs: plan
    if: github.event_name != 'pull_request' && needs.plan.outputs.platform == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c
        with:
          toolchain: 1.96.0

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Test native Windows retained-directory fidelity
        if: runner.os == 'Windows'
        run: "cargo test --package folderbase-core --lib --locked migration_filesystem::windows_directory_fidelity_tests::"

      - name: Test the public Folderbase Version contract
        run: cargo test --package folderbase-core --test folderbase_version_conformance --locked

      - name: Test the Folderbase Version 0.5 released contract
        run: cargo test --package folderbase-core --test folderbase_version_05_conformance --locked

      - name: Test metadata-only Folderbase capture planning
        run: cargo test --package folderbase-core --test folderbase_capture --locked

      - name: Test Folderbase sealing and Local Head recovery
        run: cargo test --package folderbase-core --test folderbase_seal --locked

      - name: Test injected seal crash recovery
        run: "cargo test --package folderbase-core --lib --locked folderbase_seal::tests::"

      - name: Test state confinement
        run: "cargo test --package folderbase-core --lib --locked folderbase_state::tests::"

      - name: Test independent-handle locking
        run: cargo test --package folderbase-core --lib --locked local_versions::tests::transaction_lock_is_exclusive_across_independent_handles

      - name: Test the public migration transaction contract
        run: cargo test --package folderbase-core --test migration_transaction_contract --locked

      - name: Test native Windows no-replace rename
        if: runner.os == 'Windows'
        run: "cargo test --package folderbase-core --lib --locked migration_filesystem::rename_noreplace_error_tests::"

      - name: Test native Windows retained-directory fidelity
        if: runner.os == 'Windows'
        run: "cargo test --package folderbase-core --lib --locked migration_filesystem::windows_directory_fidelity_tests::"

      - name: Test migration compatibility and lifecycle behavior
        run: cargo test --package folderbase-core --test migration --locked

      - name: Test transaction-v1 crash, restart, conflict, and rollback matrices
        run: "cargo test --package folderbase-core --lib --locked migration::migration_transaction_red_tests::"

      - name: Test native Windows reparse rejection
        if: runner.os == 'Windows'
        run: "cargo test --package folderbase-core --lib --locked folder_analysis::windows_reparse_tests::"

      - name: Verify independent Folderbase Version 0.4 digest vectors
        run: node scripts/verify-folderbase-version-digest-vectors.mjs

      - name: Verify independent Folderbase Version 0.5 digest vectors
        run: node scripts/verify-folderbase-version-0.5-digest-vectors.mjs

      - name: Test the public receiver contract
        run: cargo test --package folderbase-core --test transfer_receiver --locked

      - name: Test the public root-attestation contract
        run: cargo test --package folderbase-core --test root_attestation --locked

      - name: Test the root-attestation CLI contract
        run: cargo test --package folderbase-cli --test attest --locked

      - name: Build the native capability candidate
        run: cargo build --package folderbase-cli --locked

      - name: Conform every advertised native capability
        run: node protocol/conformance/capabilities/run.mjs --implementation ./target/debug/folderbase${{ runner.os == 'Windows' && '.exe' || '' }}

  required:
    # Keep this display name stable because main branch protection requires it.
    name: Rust quality gate
    needs: [plan, docs, npm-cli, rust, package-install, core-platforms]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAN_RESULT: ${{ needs.plan.result }}
      DOCS_REQUIRED: ${{ needs.plan.outputs.docs }}
      DOCS_RESULT: ${{ needs.docs.result }}
      NPM_REQUIRED: ${{ needs.plan.outputs.npm }}
      NPM_RESULT: ${{ needs.npm-cli.result }}
      RUST_REQUIRED: ${{ needs.plan.outputs.rust }}
      RUST_RESULT: ${{ needs.rust.result }}
      INSTALL_REQUIRED: ${{ needs.plan.outputs.install }}
      INSTALL_RESULT: ${{ needs.package-install.result }}
      PLATFORM_REQUIRED: ${{ github.event_name != 'pull_request' && needs.plan.outputs.platform == 'true' }}
      PLATFORM_RESULT: ${{ needs.core-platforms.result }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Require every applicable CI lane
        run: node scripts/ci/verify-required-results.mjs
