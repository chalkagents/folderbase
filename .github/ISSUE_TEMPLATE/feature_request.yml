name: Feature request
description: Propose a focused improvement to Folderbase
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or agent workflow is blocked today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the behavior and the smallest useful scope.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What workarounds or different approaches did you consider?

  - type: textarea
    id: risks
    attributes:
      label: Security and compatibility considerations
      description: Note any effects on local files, sharing, permissions, agents, or public interfaces.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: I am willing to help test or implement this change.
          required: false
